<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SchoolHub - Student Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f7fb;
            color: #1e293b;
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            background:
                linear-gradient(
                    135deg,
                    #312e81,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
            padding: 28px 40px;

            box-shadow:
                0 8px 30px rgba(49, 46, 129, 0.25);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.18);
            border-radius: 15px;

            font-size: 27px;
        }

        .brand h1 {
            font-size: 25px;
            font-weight: 750;
        }

        .brand p {
            opacity: 0.8;
            margin-top: 3px;
            font-size: 14px;
        }

        .add-btn {
            border: none;
            background: white;
            color: #4338ca;

            padding: 12px 20px;
            border-radius: 10px;

            font-weight: 700;
            cursor: pointer;

            transition: 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.18);
        }

        /* =========================
           MAIN
           ========================= */

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        /* =========================
           STATS
           ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            border-radius: 16px;
            padding: 22px;

            box-shadow:
                0 5px 20px rgba(15,23,42,0.06);

            border: 1px solid #e8edf5;
        }

        .stat-label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 800;
            color: #312e81;
        }

        /* =========================
           TOOLBAR
           ========================= */

        .toolbar {
            background: white;

            padding: 18px;

            border-radius: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 18px;

            box-shadow:
                0 5px 20px rgba(15,23,42,0.05);
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;

            padding: 12px 15px;

            border: 1px solid #dbe2ea;
            border-radius: 9px;

            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        .refresh-btn {
            border: 1px solid #dbe2ea;

            background: white;

            padding: 11px 17px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 600;

            color: #475569;
        }

        .refresh-btn:hover {
            background: #f8fafc;
        }

        /* =========================
           TABLE
           ========================= */

        .table-card {
            background: white;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(15,23,42,0.07);

            border: 1px solid #e8edf5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;

            color: #64748b;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            text-align: left;

            padding: 16px 20px;

            border-bottom: 1px solid #e8edf5;
        }

        td {
            padding: 17px 20px;

            border-bottom:
                1px solid #eef2f7;

            font-size: 14px;
        }

        tr:hover td {
            background: #fafbff;
        }

        .student-name {
            font-weight: 700;
            color: #1e293b;
        }

        .email {
            color: #64748b;
        }

        .course {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #eef2ff;

            color: #4338ca;

            font-size: 12px;

            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;

            padding: 8px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 700;
        }

        .edit-btn {
            background: #eef2ff;
            color: #4338ca;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .edit-btn:hover {
            background: #e0e7ff;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

        /* =========================
           MODAL
           ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,0.55);

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 500px;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 21px;
        }

        .close {
            border: none;
            background: #f1f5f9;

            width: 34px;
            height: 34px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;

            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            border: 1px solid #dbe2ea;

            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 25px;
        }

        .cancel-btn,
        .save-btn {
            border: none;

            padding: 11px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 700;
        }

        .cancel-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .save-btn {
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
        }

        /* =========================
           NOTIFICATION
           ========================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            padding: 15px 20px;

            border-radius: 10px;

            color: white;

            font-weight: 600;

            opacity: 0;

            transform:
                translateY(20px);

            pointer-events: none;

            transition: 0.3s;

            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: #16a34a;
        }

        .toast.error {
            background: #dc2626;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 22px;
            }

            .header-content {
                align-items: flex-start;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .table-card {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }
        }

    </style>
</head>

<body>

<header class="header">

    <div class="header-content">

        <div class="brand">

            <div class="brand-icon">
                🎓
            </div>

            <div>
                <h1>SchoolHub</h1>
                <p>Student Management System</p>
            </div>

        </div>

        <button class="add-btn"
                onclick="openAddModal()">

            + Add Student

        </button>

    </div>

</header>


<main class="container">

    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Students
            </div>

            <div class="stat-number"
                 id="totalStudents">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                DevOps Students
            </div>

            <div class="stat-number"
                 id="devopsStudents">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Different Courses
            </div>

            <div class="stat-number"
                 id="totalCourses">

                0

            </div>

        </div>

    </section>


    <!-- SEARCH -->

    <section class="toolbar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by name, email or course..."
                oninput="filterStudents()">

        </div>

        <button
            class="refresh-btn"
            onclick="loadStudents()">

            ↻ Refresh

        </button>

    </section>


    <!-- TABLE -->

    <section class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </section>

</main>


<!-- MODAL -->

<div class="modal"
     id="studentModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Student
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <form id="studentForm"
              onsubmit="saveStudent(event)">

            <input
                type="hidden"
                id="studentId">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    max="100"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Course
                </label>

                <input
                    type="text"
                    id="course"
                    required>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn">

                    Save Student

                </button>

            </div>

        </form>

    </div>

</div>


<!-- TOAST -->

<div id="toast"
     class="toast">

</div>


<script>

    let students = [];


    // ==========================================
    // LOAD STUDENTS
    // ==========================================

    async function loadStudents() {

        try {

            const response =
                await fetch("/students");

            if (!response.ok) {
                throw new Error("Failed to load students");
            }

            students =
                await response.json();

            renderStudents(students);

            updateStatistics(students);

        } catch (error) {

            showToast(
                "Unable to load students",
                "error"
            );

            console.error(error);

        }

    }


    // ==========================================
    // RENDER TABLE
    // ==========================================

    function renderStudents(data) {

        const table =
            document.getElementById("studentTable");

        table.innerHTML = "";


        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5"
                        class="empty">

                        No students found.

                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(student => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    <div class="student-name">
                        ${escapeHtml(student.name)}
                    </div>
                </td>

                <td>
                    <div class="email">
                        ${escapeHtml(student.email)}
                    </div>
                </td>

                <td>
                    ${student.age}
                </td>

                <td>
                    <span class="course">
                        ${escapeHtml(student.course)}
                    </span>
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="editStudent('${student.id}')">

                            Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent('${student.id}')">

                            Delete

                        </button>

                    </div>

                </td>
            `;


            table.appendChild(row);

        });

    }


    // ==========================================
    // STATISTICS
    // ==========================================

    function updateStatistics(data) {

        document.getElementById("totalStudents")
            .textContent = data.length;


        const devops =
            data.filter(
                student =>
                    student.course
                        .toLowerCase()
                        .includes("devops")
            ).length;


        document.getElementById("devopsStudents")
            .textContent = devops;


        const courses =
            new Set(
                data.map(
                    student => student.course
                )
            );


        document.getElementById("totalCourses")
            .textContent = courses.size;

    }


    // ==========================================
    // SEARCH
    // ==========================================

    function filterStudents() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();


        const filtered =
            students.filter(student =>

                student.name
                    .toLowerCase()
                    .includes(search)

                ||

                student.email
                    .toLowerCase()
                    .includes(search)

                ||

                student.course
                    .toLowerCase()
                    .includes(search)

            );


        renderStudents(filtered);

    }


    // ==========================================
    // ADD STUDENT
    // ==========================================

    function openAddModal() {

        document.getElementById("studentForm")
            .reset();

        document.getElementById("studentId")
            .value = "";

        document.getElementById("modalTitle")
            .textContent = "Add Student";


        document.getElementById("studentModal")
            .classList.add("active");

    }


    // ==========================================
    // EDIT STUDENT
    // ==========================================

    function editStudent(id) {

        const student =
            students.find(
                s => s.id === id
            );


        if (!student) {
            return;
        }


        document.getElementById("studentId")
            .value = student.id;

        document.getElementById("name")
            .value = student.name;

        document.getElementById("email")
            .value = student.email;

        document.getElementById("age")
            .value = student.age;

        document.getElementById("course")
            .value = student.course;


        document.getElementById("modalTitle")
            .textContent = "Edit Student";


        document.getElementById("studentModal")
            .classList.add("active");

    }


    // ==========================================
    // SAVE STUDENT
    // ==========================================

    async function saveStudent(event) {

        event.preventDefault();


        const id =
            document.getElementById("studentId")
                .value;


        const student = {

            name:
                document.getElementById("name")
                    .value,

            email:
                document.getElementById("email")
                    .value,

            age:
                Number(
                    document.getElementById("age")
                        .value
                ),

            course:
                document.getElementById("course")
                    .value

        };


        const isEdit =
            id !== "";


        const url =
            isEdit
                ? `/students/${id}`
                : "/students";


        const method =
            isEdit
                ? "PUT"
                : "POST";


        try {

            const response =
                await fetch(
                    url,
                    {
                        method: method,

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(student)
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to save student"
                );

            }


            closeModal();

            await loadStudents();


            showToast(
                isEdit
                    ? "Student updated successfully"
                    : "Student added successfully",

                "success"
            );


        } catch (error) {

            showToast(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // DELETE STUDENT
    // ==========================================

    async function deleteStudent(id) {

        const student =
            students.find(
                s => s.id === id
            );


        if (!student) {
            return;
        }


        const confirmed =
            confirm(
                `Delete ${student.name}?`
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/students/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to delete student"
                );

            }


            await loadStudents();


            showToast(
                "Student deleted successfully",
                "success"
            );


        } catch (error) {

            showToast(
                error.message,
                "error"
            );

        }

    }


    // ==========================================
    // CLOSE MODAL
    // ==========================================

    function closeModal() {

        document.getElementById("studentModal")
            .classList.remove("active");

    }


    // ==========================================
    // TOAST
    // ==========================================

    function showToast(message, type) {

        const toast =
            document.getElementById("toast");


        toast.textContent = message;

        toast.className =
            `toast ${type} show`;


        setTimeout(() => {

            toast.classList.remove("show");

        }, 3000);

    }


    // ==========================================
    // BASIC HTML ESCAPING
    // ==========================================

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }


    // ==========================================
    // START APPLICATION
    // ==========================================

    loadStudents();

</script>

</body>
</html>
