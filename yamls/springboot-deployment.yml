apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot

  template:
    metadata:
      labels:
        app: springboot

    spec:
      containers:
        - name: springboot
          image: abhisalunke16/java-school-app:v1

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://admin:password123@mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/school?replicaSet=rs0&authSource=admin"

          readinessProbe:
            httpGet:
              path: /students
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /students
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
